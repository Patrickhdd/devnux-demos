name: clinic-booking

on:
  push:
    paths: ["clinic-booking/**", ".github/workflows/clinic-booking.yml"]
  pull_request:
    paths: ["clinic-booking/**", ".github/workflows/clinic-booking.yml"]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clinic-booking/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test (Testcontainers starts PostgreSQL)
        run: mvn -B verify

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clinic-booking/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clinic-booking/web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build the images
        run: docker compose -f clinic-booking/docker-compose.yml build
