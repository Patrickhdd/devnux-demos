name: inventory-api

on:
  push:
    paths: ["inventory-api/**", ".github/workflows/inventory-api.yml"]
  pull_request:
    paths: ["inventory-api/**", ".github/workflows/inventory-api.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventory-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test (Testcontainers PostgreSQL; every response validated against the OpenAPI contract)
        run: mvn -B verify

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the container image
        run: docker build -t inventory-service:${{ github.sha }} inventory-api

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventory-api/infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
