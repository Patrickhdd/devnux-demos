spring:
  application:
    name: clinic-booking-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/clinic}
    username: ${DATABASE_USER:clinic}
    password: ${DATABASE_PASSWORD:clinic}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true

clinic:
  # Time zone the clinic works in. Opening hours and slots are in this zone.
  zone: ${CLINIC_ZONE:America/New_York}
  # How far ahead patients can book.
  booking-window-days: 30
  # Create demo doctors, patients and appointments on first start.
  seed-demo-data: ${SEED_DEMO_DATA:true}
  jwt:
    # HMAC secret for signing access tokens. Must be at least 32 bytes. Override in production.
    secret: ${JWT_SECRET:change-me-this-is-a-local-development-secret}
    ttl: 8h
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
