# One command to run the whole demo:  docker compose up --build
# Then open http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinic
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
    ports:
      - "5432:5432"   # handy for local development
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/clinic
      DATABASE_USER: clinic
      DATABASE_PASSWORD: clinic
      JWT_SECRET: local-demo-secret-please-change-in-production
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  db-data:
