# Run the service locally:  docker compose up --build
# API on http://localhost:8080/api/v1 (contract at http://localhost:8080/openapi.yaml)
# Demo keys: dev-write-key (read + write), dev-read-key (read only)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 3s
      retries: 20

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/inventory
      DATABASE_USER: inventory
      DATABASE_PASSWORD: inventory
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
